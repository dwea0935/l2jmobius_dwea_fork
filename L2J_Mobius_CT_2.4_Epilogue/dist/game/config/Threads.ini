# ---------------------------------------------------------------------------
# Thread Configuration (Java 21+ Virtual Thread Architecture)
# ---------------------------------------------------------------------------
# NOTE: ThreadPool now uses unbounded Java Virtual Thread executors
# (`Executors.newVirtualThreadPerTaskExecutor()`) for instant and general
# scheduled task execution, backed by a lightweight 2-thread platform timer
# trigger (`L2J-Timer-Trigger`) that dispatches timer expirations onto
# virtual threads.
#
# `ScheduledThreadPoolSize` and `InstantThreadPoolSize` are retained only as
# fallback sizing values if you ever revert `ThreadPool.java` to fixed
# platform-thread pools. Under the current Virtual Thread architecture,
# changing these numbers has no runtime effect.

# Legacy fallback size for the scheduled thread pool (-1 = availableProcessors * 4).
ScheduledThreadPoolSize = -1

# Legacy fallback size for the instant thread pool (-1 = availableProcessors * 2).
InstantThreadPoolSize = -1

# Parallelize XML data loading (Items, Skills, and IXmlReader directories)
# across Java Virtual Threads using structured try-with-resources
# `Executors.newVirtualThreadPerTaskExecutor()` (no busy-wait spin loops or
# leaked thread pools).
# Default: False
ThreadsForLoading = False
