# ---------------------------------------------------------------------------
# Fake players
# ---------------------------------------------------------------------------
# Our fake player system uses the existing NPC system, allowing fake players
# to function seamlessly like NPCs with minimal impact on server performance.

# Enable fake players.
EnableFakePlayers = True

# Enable chatting with fake players.
FakePlayerChat = True

# Enable shots usage for fake players.
FakePlayerUseShots = True

# Reward PvP kills by killing fake players.
FakePlayerKillsRewardPvP = True

# Fake player kills apply karma rules.
FakePlayerUnflaggedKillsKarma = True

# Fake players can be attacked without PvP flagging.
FakePlayerAutoAttackable = False

# Aggressive AI fake players attack nearby monsters.
FakePlayerAggroMonsters = True

# Aggressive AI fake players attack nearby players.
FakePlayerAggroPlayers = False

# Aggressive AI fake players attack nearby fake players.
FakePlayerAggroFPC = False

# Fake players can drop items when killing monsters.
FakePlayerCanDropItems = True

# Fake players can pickup dropped items.
FakePlayerCanPickup = True

# ---------------------------------------------------------------------------
# Tactical Utility-AI & Java 27 Virtual-Thread LLM Bot Engine
# ---------------------------------------------------------------------------
# Enable the 250ms Tactical Utility-AI loop (archetype kiting, backstab flanking,
# healer triage, tank intercept, self-potion second wind, and player squad assist).
FakePlayerTacticalAI = True

# Enable non-blocking Java 27 Virtual-Thread LLM chat & tactical directive bridge
# (compatible with local Ollama, vLLM, LM Studio, or OpenAI chat/completions API).
FakePlayerLlmEnabled = False

# OpenAI-compatible chat completions HTTP endpoint.
FakePlayerLlmEndpoint = http://127.0.0.1:11434/v1/chat/completions

# Model identifier passed to the LLM endpoint.
FakePlayerLlmModel = llama3.2:3b

# Optional Bearer API key (leave empty for local Ollama/vLLM).
FakePlayerLlmApiKey = 

# HTTP request timeout in milliseconds before falling back to heuristic/XML chat.
FakePlayerLlmTimeoutMs = 4000

